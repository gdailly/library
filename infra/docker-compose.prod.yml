# Server deployment: MariaDB + backend + web app behind Caddy (HTTPS). Guide: docs/deploiement.md
# Run from infra/:  docker compose -f docker-compose.prod.yml up -d --build   (values read from infra/.env)
name: library

services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The backend runs as uid 10001; a bind-mounted directory created by Docker belongs to root.
  covers-permissions:
    image: busybox:1.37
    command: chown 10001 /data/covers
    volumes:
      - ./data/covers:/data/covers

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      covers-permissions:
        condition: service_completed_successfully
    environment:
      MARIADB_HOST: mariadb
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL}
      # Only needed for a web app served from another origin than the API.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      COVER_URL_SECRET: ${COVER_URL_SECRET}
      COVERS_DIRECTORY: /data/covers
      RECOGNITION_ENABLED: ${RECOGNITION_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
    volumes:
      - ./data/covers:/data/covers
    # No published port: only Caddy reaches the backend.

  web:
    build:
      context: ../frontend
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and Let's Encrypt account: kept across restarts.
      - ./data/caddy:/data
      - ./data/caddy-config:/config
