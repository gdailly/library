openapi: 3.1.0
info:
  title: Library API
  version: "1"
servers:
- url: /
security:
- googleIdToken: []
tags:
- name: Series
  description: "Séries : albums présents, envies et tomes manquants"
- name: Me
  description: Utilisateur connecté
- name: Admin
  description: Administration des métadonnées (propriétaire)
- name: Lookup
  description: Recherche de métadonnées
- name: Categories
  description: Catégories de la bibliothèque
- name: Books
  description: "Livres, couvertures et suivi de lecture"
- name: Members
  description: Membres de la bibliothèque
paths:
  /api/categories/{id}:
    put:
      tags:
      - Categories
      operationId: updateCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
    delete:
      tags:
      - Categories
      operationId: deleteCategory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/books/{id}:
    get:
      tags:
      - Books
      operationId: getBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookResponse"
    put:
      tags:
      - Books
      operationId: updateBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookResponse"
    delete:
      tags:
      - Books
      operationId: deleteBook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/books/{id}/reading:
    put:
      tags:
      - Books
      operationId: saveMyReading
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReadingResponse"
  /api/books/{id}/cover:
    get:
      tags:
      - Books
      operationId: getCover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: size
        in: query
        required: false
        schema:
          type: string
          default: thumb
      - name: key
        in: query
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: sig
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
    put:
      tags:
      - Books
      operationId: uploadCover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CoverResponse"
    delete:
      tags:
      - Books
      operationId: deleteCover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/library/members:
    get:
      tags:
      - Members
      operationId: listMembers
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberResponse"
    post:
      tags:
      - Members
      operationId: inviteMember
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberResponse"
  /api/categories:
    get:
      tags:
      - Categories
      operationId: listCategories
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
    post:
      tags:
      - Categories
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoryResponse"
  /api/books:
    get:
      tags:
      - Books
      operationId: listBooks
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: owned
        in: query
        required: false
        schema:
          type: boolean
      - name: category
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/ReadingStatus"
      - name: minRating
        in: query
        required: false
        schema:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseBookResponse"
    post:
      tags:
      - Books
      operationId: createBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookResponse"
  /api/admin/series/sync:
    get:
      tags:
      - Admin
      operationId: getSeriesSync
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SeriesSyncJobResponse"
    post:
      tags:
      - Admin
      operationId: startSeriesSync
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SeriesSyncJobResponse"
  /api/admin/series/sync-one:
    post:
      tags:
      - Admin
      operationId: syncOneSeries
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          maxLength: 300
          minLength: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SeriesDetailResponse"
  /api/admin/metadata/sync:
    get:
      tags:
      - Admin
      operationId: getMetadataSync
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataSyncJobResponse"
    post:
      tags:
      - Admin
      operationId: startMetadataSync
      parameters:
      - name: mode
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/SyncMode"
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataSyncJobResponse"
  /api/admin/metadata/books/{id}/sync:
    post:
      tags:
      - Admin
      operationId: syncBookMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: mode
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/SyncMode"
      - name: source
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/MetadataSource"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookSyncResponse"
  /api/admin/metadata/books/{id}/apply:
    post:
      tags:
      - Admin
      operationId: applyBookMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyMetadataRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookMetadataResponse"
  /api/series:
    get:
      tags:
      - Series
      operationId: listSeries
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesResponse"
  /api/series/volumes:
    get:
      tags:
      - Series
      operationId: getSeriesVolumes
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          maxLength: 300
          minLength: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SeriesDetailResponse"
  /api/series/books:
    get:
      tags:
      - Series
      operationId: listSeriesBooks
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          maxLength: 300
          minLength: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookResponse"
  /api/me:
    get:
      tags:
      - Me
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/lookup/isbn/{isbn}:
    get:
      tags:
      - Lookup
      operationId: lookupIsbn
      parameters:
      - name: isbn
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/IsbnLookupResponse"
  /api/admin/syncs:
    get:
      tags:
      - Admin
      operationId: listSyncRuns
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSyncRunResponse"
  /api/admin/syncs/{id}:
    get:
      tags:
      - Admin
      operationId: getSyncRun
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SyncRunResponse"
  /api/admin/syncs/{id}/items:
    get:
      tags:
      - Admin
      operationId: listSyncRunItems
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: problemsOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseSyncRunItemResponse"
  /api/admin/metadata:
    get:
      tags:
      - Admin
      operationId: getMetadataAdmin
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MetadataAdminResponse"
  /api/admin/metadata/books:
    get:
      tags:
      - Admin
      operationId: listBookMetadata
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: onlyDifferences
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseBookMetadataSummary"
  /api/admin/metadata/books/{id}:
    get:
      tags:
      - Admin
      operationId: getBookMetadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookMetadataResponse"
  /api/library/members/{userId}:
    delete:
      tags:
      - Members
      operationId: removeMember
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/admin/metadata/cache:
    delete:
      tags:
      - Admin
      operationId: clearIsbnCache
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/CacheScope"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CacheClearResponse"
components:
  schemas:
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        color:
          type: string
          pattern: "#[0-9A-Fa-f]{6}"
      required:
      - color
      - name
    CategoryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
        bookCount:
          type: integer
          format: int64
      required:
      - color
      - id
      - name
    BookRequest:
      type: object
      properties:
        isbn:
          type: string
          maxLength: 20
          minLength: 0
        title:
          type: string
          maxLength: 500
          minLength: 0
        subtitle:
          type: string
          maxLength: 500
          minLength: 0
        series:
          type: string
          maxLength: 300
          minLength: 0
        seriesNumber:
          type: integer
          format: int32
          maximum: 9999
          minimum: 0
        authors:
          type: string
          maxLength: 1000
          minLength: 0
        publisher:
          type: string
          maxLength: 300
          minLength: 0
        year:
          type: integer
          format: int32
          maximum: 9999
          minimum: 0
        pages:
          type: integer
          format: int32
          maximum: 100000
          minimum: 1
        language:
          type: string
          maxLength: 10
          minLength: 0
        summary:
          type: string
          maxLength: 20000
          minLength: 0
        owned:
          type: boolean
        categoryIds:
          type: array
          items:
            type: integer
            format: int64
          maxItems: 50
          minItems: 0
      required:
      - title
    BookResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isbn13:
          type: string
        title:
          type: string
        subtitle:
          type: string
        series:
          type: string
        seriesNumber:
          type: integer
          format: int32
        authors:
          type: string
        publisher:
          type: string
        year:
          type: integer
          format: int32
        pages:
          type: integer
          format: int32
        language:
          type: string
        summary:
          type: string
        owned:
          type: boolean
        addedBy:
          type: integer
          format: int64
        addedByName:
          type: string
        createdAt:
          type: string
          format: date-time
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryResponse"
        myReading:
          $ref: "#/components/schemas/ReadingResponse"
        cover:
          $ref: "#/components/schemas/CoverResponse"
        otherReadings:
          type: array
          items:
            $ref: "#/components/schemas/OtherReadingResponse"
      required:
      - categories
      - createdAt
      - id
      - otherReadings
      - owned
      - title
    CoverResponse:
      type: object
      properties:
        thumbUrl:
          type: string
        mediumUrl:
          type: string
      required:
      - mediumUrl
      - thumbUrl
    OtherReadingResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        name:
          type: string
        status:
          $ref: "#/components/schemas/ReadingStatus"
        rating:
          type: integer
          format: int32
        review:
          type: string
      required:
      - name
      - status
      - userId
    ReadingResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReadingStatus"
        rating:
          type: integer
          format: int32
        review:
          type: string
        startedOn:
          type: string
          format: date
        finishedOn:
          type: string
          format: date
      required:
      - status
    ReadingStatus:
      type: string
      enum:
      - TO_READ
      - READING
      - READ
      - ABANDONED
    ReadingRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReadingStatus"
        rating:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        review:
          type: string
          maxLength: 20000
          minLength: 0
        startedOn:
          type: string
          format: date
        finishedOn:
          type: string
          format: date
      required:
      - status
    MemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          minLength: 0
        role:
          $ref: "#/components/schemas/Role"
      required:
      - email
    Role:
      type: string
      enum:
      - OWNER
      - MEMBER
    MemberResponse:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        role:
          $ref: "#/components/schemas/Role"
      required:
      - email
      - role
      - userId
    SeriesSyncJobResponse:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/SyncState"
        total:
          type: integer
          format: int32
        processed:
          type: integer
          format: int32
        found:
          type: integer
          format: int32
        notFound:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      required:
      - failed
      - found
      - notFound
      - processed
      - state
      - total
    SyncState:
      type: string
      enum:
      - IDLE
      - RUNNING
      - DONE
    SeriesDetailResponse:
      type: object
      properties:
        name:
          type: string
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/SeriesVolumeResponse"
        unnumbered:
          type: array
          items:
            $ref: "#/components/schemas/BookResponse"
        catalogFetchedAt:
          type: string
          format: date-time
      required:
      - name
      - unnumbered
      - volumes
    SeriesVolumeResponse:
      type: object
      properties:
        number:
          type: integer
          format: int32
        title:
          type: string
        isbn13:
          type: string
        year:
          type: integer
          format: int32
        coverUrl:
          type: string
        books:
          type: array
          items:
            $ref: "#/components/schemas/BookResponse"
      required:
      - books
      - number
    SyncMode:
      type: string
      enum:
      - FILL
      - REPLACE
      - FETCH
    MetadataSyncJobResponse:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/SyncState"
        total:
          type: integer
          format: int32
        processed:
          type: integer
          format: int32
        updated:
          type: integer
          format: int32
        unchanged:
          type: integer
          format: int32
        notFound:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
      required:
      - failed
      - notFound
      - processed
      - state
      - total
      - unchanged
      - updated
    MetadataSource:
      type: string
      enum:
      - LIBRARY
      - OPEN_LIBRARY
      - GOOGLE_BOOKS
      - BNF
    BookSyncResponse:
      type: object
      properties:
        outcome:
          $ref: "#/components/schemas/SyncOutcome"
        changedFields:
          type: array
          items:
            type: string
        book:
          $ref: "#/components/schemas/BookResponse"
      required:
      - book
      - changedFields
      - outcome
    SyncOutcome:
      type: string
      enum:
      - UPDATED
      - UNCHANGED
      - NOT_FOUND
    ApplyMetadataRequest:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/MetadataSource"
        fields:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - fields
      - source
    BookMetadataResponse:
      type: object
      properties:
        book:
          $ref: "#/components/schemas/BookResponse"
        fetchedAt:
          type: string
          format: date-time
        notFound:
          type: boolean
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourceMetadataResponse"
        merged:
          $ref: "#/components/schemas/SourceMetadataResponse"
        differences:
          type: array
          items:
            type: string
      required:
      - book
      - differences
      - notFound
      - sources
    SourceMetadataResponse:
      type: object
      properties:
        source:
          $ref: "#/components/schemas/MetadataSource"
        title:
          type: string
        subtitle:
          type: string
        series:
          type: string
        seriesNumber:
          type: integer
          format: int32
        authors:
          type: string
        publisher:
          type: string
        year:
          type: integer
          format: int32
        pages:
          type: integer
          format: int32
        language:
          type: string
        summary:
          type: string
        coverUrl:
          type: string
      required:
      - title
    SeriesResponse:
      type: object
      properties:
        name:
          type: string
        books:
          type: integer
          format: int32
        owned:
          type: integer
          format: int32
        ownedNumbers:
          type: array
          items:
            type: integer
