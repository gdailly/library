spring:
  application:
    name: library
  datasource:
    url: jdbc:mariadb://${MARIADB_HOST:localhost}:${MARIADB_PORT:3306}/${MARIADB_DATABASE:livre}
    username: ${MARIADB_USER:livre}
    password: ${MARIADB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  error:
    include-message: never
  # Behind Caddy: the scheme and host of the browser come from X-Forwarded-Proto/Host, so that the app's own
  # origin (https://…) is recognised and its requests are not rejected as cross-origin ("Invalid CORS request").
  forward-headers-strategy: framework

logging:
  level:
    # Hibernate logs the JDBC connection settings at startup.
    org.hibernate.orm.connections.pooling: warn

management:
  endpoints:
    web:
      exposure:
        include: health

livre:
  auth:
    google-client-ids: ${GOOGLE_CLIENT_IDS:}
  bootstrap:
    owner-email: ${BOOTSTRAP_OWNER_EMAIL:}
    library-name: ${BOOTSTRAP_LIBRARY_NAME:Ma bibliothèque}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  isbn:
    google-books-api-key: ${GOOGLE_BOOKS_API_KEY:}
  covers:
    directory: ${COVERS_DIRECTORY:covers}
    url-secret: ${COVER_URL_SECRET:}
