include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated from docs/api/openapi.yaml by scripts/generate-api-client.sh
    - packages/library_api/**
    - build/**
    - android/**
    - web/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - directives_ordering
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - unawaited_futures
